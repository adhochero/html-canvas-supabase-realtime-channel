<!DOCTYPE html>
<html>
<head>
  <title>Canvas Demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- Canvas plus the weapon button share a box sized to the canvas, so the button
       can anchor to the canvas corner rather than the viewport. -->
  <div id="stage">
    <canvas id="gameCanvas"></canvas>
    <button id="weaponButton" type="button" aria-label="Swap weapon">WPN</button>
  </div>

  <!-- Shown on load; picking a difficulty sets the player colour and starts the game. -->
  <div id="difficultyOverlay">
    <h1>DIFFICULTY</h1>
    <div id="difficultyButtons">
      <button type="button" data-color="#ffb595">EASY</button>
      <button type="button" data-color="#ab7963">MEDIUM</button>
      <button type="button" data-color="#7a5440">HARD</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
